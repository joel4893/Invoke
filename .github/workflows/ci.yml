name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '18'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run CLI smoke tests
        run: npm test
